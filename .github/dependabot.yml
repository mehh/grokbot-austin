# Dependabot: monthly, grouped (one version PR + one security PR per ecosystem).
# Actions cost (Nov 2026): every Dependabot PR runs this repo's CI, so fewer, grouped PRs.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    npm-version:
      applies-to: version-updates
      patterns:
      - '*'
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /print-agent
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    pip-version:
      applies-to: version-updates
      patterns:
      - '*'
    pip-security:
      applies-to: security-updates
      patterns:
      - '*'
